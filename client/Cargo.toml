[package]
name = "pinhole"
version = "0.1.0"
edition = "2024"
authors = ["Pinhole Team"]
repository = "https://github.com/RafeLoya/pinhole"
description = "Client for terminal-based video call service"

[dependencies]
common = { path = "../common" }

tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5.37", features = ["derive"] }
rand = "0.9.1"
ffmpeg-sidecar = "2.3.0"
serde = { version = "1.0", features = ["derive"] }
config = "0.15.19"
itoa = "1.0"

[dev-dependencies]
criterion = "0.8.1"

[[bench]]
name = "ascii_rendering"
harness = false

[lib]
name = "pinhole"
path = "src/lib.rs"

[[bin]]
name = "pinhole"
path = "src/main.rs"
