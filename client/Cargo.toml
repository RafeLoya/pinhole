[package]
name = "pinhole"
version = "0.1.0"
edition = "2024"
authors = ["Pinhole Team"]
repository = "https://github.com/RafeLoya/pinhole"
description = "Client for terminal-based video call service"

[dependencies]
common = { path = "../common" }

tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7.18"
clap = { version = "4.5.54", features = ["derive"] }
rand = "0.9.2"
ffmpeg-sidecar = "2.4.0"
serde = { version = "1.0.228", features = ["derive"] }
config = "0.15.19"
itoa = "1.0.17"
crossbeam = "0.8.4"
arc-swap = "1.8.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
termwiz = "0.23.3"
anyhow = "1.0.100"

[dev-dependencies]
criterion = "0.8.1"

[[bench]]
name = "text_rendering"
harness = false

[lib]
name = "pinhole"
path = "src/lib.rs"

[[bin]]
name = "pinhole"
path = "src/main.rs"
