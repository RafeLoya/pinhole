[package]
name = "pinhole-server"
version = "0.1.0"
edition = "2024"
authors = ["Pinhole team"]
repository = "https://github.com/RafeLoya/pinhole"
description = "SFU Server for terminal-based video call system."

[dependencies]
common = { path = "../common" }
clap = { version = "4.5.54", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
axum = "0.8.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"

[target.'cfg(target_os = "linux")'.dependencies]
tokio-tun = "0.15.0"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.3"

[[bin]]
name = "pinhole-server"
path = "src/main.rs"
